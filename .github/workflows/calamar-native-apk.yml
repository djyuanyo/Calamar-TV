name: Calamar TV · APK Android y TV
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'hosting/calamar-player.php', 'data/tdt.json', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
  pull_request:
    paths: ['app/**', 'hosting/calamar-player.php', 'data/tdt.json', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar adaptación real de HEVC a HLS para Chromecast
        run: |
          # This Android release does not change the Chromecast transcoder. Avoid package mirrors
          # blocking the APK; PHP checks run on the web workflow too.
          if ! command -v php >/dev/null; then
            echo 'PHP no está en este runner; validación del puente en el flujo web.'
            exit 0
          fi
          php -l hosting/calamar-match.php
          php -l hosting/calamar-http-source.php
          php -l hosting/calamar-tv-relay.php
          php -l hosting/calamar-player.php
          php -l hosting/calamar-cast.php
          php -l hosting/calamar-cast-install.php
          python -m unittest discover -s tools -p 'test_match_resolver.py' -v
          python -m unittest discover -s tools -p 'test_player_relay.py' -v
          if command -v ffmpeg >/dev/null; then
            python -m unittest discover -s tools -p 'test_cast_bridge.py' -v
          fi
      - name: Compilar release y debug con validación
        run: |
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:lintDebug :app:testDebugUnitTest || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
      - name: Verificar vídeo de prueba MPEG-TS
        run: test -s app/src/androidTest/assets/live.ts
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproducir TS por HTTP y recuperar conexión atascada en Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Reproducir y cambiar señales con mando en Android TV API 31
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86
          target: android-tv
          avd-name: calamar-tv-api31
          disable-animations: true
          script: |
            adb shell pm list features | grep -q android.software.leanback
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=es.yuanyo.calamartv.HostingPlaybackTest,es.yuanyo.calamartv.TvCatalogTest,es.yuanyo.calamartv.MadplayHostedPlaybackTest
      - name: Mostrar errores del reproductor en el emulador
        if: failure()
        run: |
          python - <<'PYCODE'
          import pathlib, re, html
          root = pathlib.Path('app/build/reports/androidTests/connected')
          for name in ('HostingPlaybackTest', 'ResolvedPlaybackTest', 'ChromiumPlaybackTest', 'TvCatalogTest'):
              for path in root.rglob('*' + name + '.html'):
                  print('Informe:', path)
                  print(html.unescape(re.sub(r'<[^>]+>', '', path.read_text()))[:40000])
          PYCODE
      - name: Guardar informe de reproducción Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-playback-report
          path: app/build/reports/androidTests/connected
      - name: Verificar el catálogo incluido en la APK release
        run: |
          python - <<'PY'
          import glob, json, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          with zipfile.ZipFile(apk) as archive:
              tdt = json.loads(archive.read('assets/tdt.json'))
              custom = json.loads(archive.read('assets/custom.json'))
          playable = [c for c in tdt['channels'] if c.get('streams')]
          assert len(playable) >= 40 and isinstance(custom.get('channels'), list), 'Catálogo incompleto en la APK'
          print(f"APK release verificada: {len(tdt['channels'])} canales TDT, {len(playable)} reproducibles")
          PY
      - name: Preparar firma de distribución si está configurada
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.CALAMAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            # Spaces or line breaks left over from copying the secret are ignored.
            printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/calamar.p12"
            echo "CALAMAR_KEYSTORE_PATH=$RUNNER_TEMP/calamar.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto CALAMAR_KEYSTORE_BASE64: las APK de esta versión no se podrán instalar encima de las anteriores."
          fi
      - name: Compilar APK con firma persistente
        if: env.CALAMAR_KEYSTORE_PATH != ''
        env:
          CALAMAR_KEYSTORE_PASSWORD: ${{ secrets.CALAMAR_KEYSTORE_PASSWORD }}
          CALAMAR_KEY_ALIAS: ${{ secrets.CALAMAR_KEY_ALIAS }}
          CALAMAR_KEY_PASSWORD: ${{ secrets.CALAMAR_KEY_PASSWORD }}
        run: |
          # Release and debug share the permanent key, so any APK of a release updates the installed app.
          gradle --no-daemon :app:assembleRelease :app:assembleDebug
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|SHA-1' | sed "s|^|$(basename "$apk"): |"
          done
      - name: Publicar APK en GitHub Releases
        continue-on-error: true
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          mkdir -p dist
          if [ -n "$CALAMAR_KEYSTORE_PATH" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Calamar-TV-$version.apk"
          else
            cp app/build/outputs/apk/release/*.apk "dist/Calamar-TV-$version-sin-firmar.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Calamar-TV-$version-debug.apk"
          (cd dist && zip "Calamar-TV-$version-compilada.zip" *.apk)
          (cd hosting && zip ../dist/Calamar-Player-hosting.zip calamar-player.php calamar-http-source.php)
          (cd hosting && zip ../dist/Calamar-Chromecast-hosting.zip calamar-cast.php calamar-cast-install.php calamar-http-source.php calamar-tv-relay.php README-Chromecast.txt)
          (cd hosting && zip ../dist/Calamar-Marcadores-hosting.zip calamar-match.php calamar-http-source.php README-Marcadores.txt)
          # The in-app updater accepts only a signed release APK and verifies this checksum/size.
          if [ -n "$CALAMAR_KEYSTORE_PATH" ]; then
            python - <<'PYUPDATE'
          import hashlib, json, pathlib, re
          gradle = pathlib.Path('app/build.gradle').read_text()
          version = re.search(r"versionName '([^']+)'", gradle)[1]
          code = int(re.search(r"versionCode (\d+)", gradle)[1])
          apk = pathlib.Path(f'dist/Calamar-TV-{version}.apk')
          manifest = {'applicationId': 'es.yuanyo.calamartv', 'versionName': version,
                      'versionCode': code, 'bytes': apk.stat().st_size,
                      'sha256': hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest(),
                      'apkUrl': f'https://github.com/djyuanyo/Calamar-TV/releases/download/v{version}/Calamar-TV-{version}.apk'}
          pathlib.Path('dist/Calamar-TV-update.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYUPDATE
          fi
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" \
            --target "$GITHUB_SHA" --title "Calamar TV $version" \
            --notes "APK de Calamar TV $version para Android y Android TV. Instala Calamar-TV-$version.apk (firmada) para poder actualizar encima de versiones anteriores."
          gh release upload "v$version" dist/*.apk dist/*.zip --clobber
          # Publish metadata last, so a checker can never see a version without its APK.
          if [ -f dist/Calamar-TV-update.json ]; then
            gh release upload "v$version" dist/Calamar-TV-update.json --clobber
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Calamar-TV-Android-TV
          retention-days: 3
          path: |
            dist/*.apk
            dist/*.zip
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error