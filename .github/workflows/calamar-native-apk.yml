name: Calamar TV · APK Android y TV
on:
  workflow_dispatch:
  push:
    paths: ['app/**', 'data/tdt.json', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
  pull_request:
    paths: ['app/**', 'data/tdt.json', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar adaptación real de HEVC a HLS para Chromecast
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli ffmpeg
          php -l hosting/calamar-match.php
          php -l hosting/calamar-http-source.php
          php -l hosting/calamar-tv-relay.php
          php -l hosting/calamar-video.php
          php -l hosting/calamar-cast.php
          php -l hosting/calamar-cast-install.php
          python -m unittest discover -s tools -p 'test_match_resolver.py' -v
          python -m unittest discover -s tools -p 'test_cast_bridge.py' -v
          python -m unittest discover -s tools -p 'test_video_bridge.py' -v
      - name: Compilar release y debug con validación
        run: |
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:lintDebug :app:testDebugUnitTest || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
      - name: Verificar el catálogo incluido en la APK release
        run: |
          python - <<'PY'
          import glob, json, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          with zipfile.ZipFile(apk) as archive:
              tdt = json.loads(archive.read('assets/tdt.json'))
              custom = json.loads(archive.read('assets/custom.json'))
          playable = [c for c in tdt['channels'] if c.get('streams')]
          assert len(playable) >= 40 and isinstance(custom.get('channels'), list), 'Catálogo incompleto en la APK'
          print(f"APK release verificada: {len(tdt['channels'])} canales TDT, {len(playable)} reproducibles")
          PY
      - name: Preparar firma de distribución si está configurada
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.CALAMAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            # Spaces or line breaks left over from copying the secret are ignored.
            printf '%s' "$KEYSTORE" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/calamar.p12"
            echo "CALAMAR_KEYSTORE_PATH=$RUNNER_TEMP/calamar.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto CALAMAR_KEYSTORE_BASE64: las APK de esta versión no se podrán instalar encima de las anteriores."
          fi
      - name: Compilar APK con firma persistente
        if: env.CALAMAR_KEYSTORE_PATH != ''
        env:
          CALAMAR_KEYSTORE_PASSWORD: ${{ secrets.CALAMAR_KEYSTORE_PASSWORD }}
          CALAMAR_KEY_ALIAS: ${{ secrets.CALAMAR_KEY_ALIAS }}
          CALAMAR_KEY_PASSWORD: ${{ secrets.CALAMAR_KEY_PASSWORD }}
        run: |
          # Release and debug share the permanent key, so any APK of a release updates the installed app.
          gradle --no-daemon :app:assembleRelease :app:assembleDebug
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-256|SHA-1' | sed "s|^|$(basename "$apk"): |"
          done
      - name: Publicar APK en GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          mkdir -p dist
          if [ -n "$CALAMAR_KEYSTORE_PATH" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Calamar-TV-$version.apk"
          else
            cp app/build/outputs/apk/release/*.apk "dist/Calamar-TV-$version-sin-firmar.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Calamar-TV-$version-debug.apk"
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" \
            --target "$GITHUB_SHA" --title "Calamar TV $version" \
            --notes "APK de Calamar TV $version para Android y Android TV. Instala Calamar-TV-$version.apk (firmada) para poder actualizar encima de versiones anteriores."
          (cd dist && zip "Calamar-TV-$version-compilada.zip" *.apk)
          (cd hosting && zip ../dist/Calamar-Chromecast-hosting.zip calamar-cast.php calamar-cast-install.php calamar-http-source.php calamar-tv-relay.php calamar-video.php README-Chromecast.txt)
          (cd hosting && zip ../dist/Calamar-Marcadores-hosting.zip calamar-match.php calamar-http-source.php README-Marcadores.txt)
          gh release upload "v$version" dist/*.apk dist/*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        with:
          name: Calamar-TV-Android-TV
          retention-days: 3
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error