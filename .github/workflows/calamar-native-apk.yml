name: Calamar TV · APK Android y TV
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
  pull_request:
    paths: ['app/**', '*.gradle', 'gradle.properties', '.github/workflows/calamar-native-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar release y debug con validación
        run: |
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:lintDebug :app:testDebugUnitTest || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || true
            exit 1
          }
      - name: Verificar contenido real de la APK release
        run: |
          python - <<'PY'
          import glob, gzip, json, zipfile
          apk = glob.glob('app/build/outputs/apk/release/*.apk')[0]
          with zipfile.ZipFile(apk) as archive:
              if 'assets/events-initial.json' in archive.namelist():
                  payload = archive.read('assets/events-initial.json')
              else:
                  payload = gzip.decompress(archive.read('assets/events-initial.json.gz'))
          data = json.loads(payload)
          events = data['data']
          channels = {s.get('player_url', s.get('url')) for e in events for s in e.get('sources', []) if s.get('source') == 'own'}
          assert events and channels, 'La APK no contiene la agenda y el catálogo iniciales'
          print(f'APK release verificada: {len(events)} eventos, {len(channels)} canales')
          PY
      - name: Preparar firma de distribución si está configurada
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.CALAMAR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/calamar.p12"
            echo "CALAMAR_KEYSTORE_PATH=$RUNNER_TEMP/calamar.p12" >> "$GITHUB_ENV"
          fi
      - name: Compilar APK con firma persistente
        if: env.CALAMAR_KEYSTORE_PATH != ''
        env:
          CALAMAR_KEYSTORE_PASSWORD: ${{ secrets.CALAMAR_KEYSTORE_PASSWORD }}
          CALAMAR_KEY_ALIAS: ${{ secrets.CALAMAR_KEY_ALIAS }}
          CALAMAR_KEY_PASSWORD: ${{ secrets.CALAMAR_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Calamar-TV-1.2.0-Android-TV
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
