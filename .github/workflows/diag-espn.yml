name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const res = await fetch('https://firestore.googleapis.com/v1/projects/menciamedia/databases/(default)/documents/calamarCatalog/custom');
          const c = JSON.parse((await res.json()).fields.json.stringValue);
          const browser = await chromium.launch({ args: ['--autoplay-policy=no-user-gesture-required'] });
          for (const ch of [c.channels[4], c.channels[0]]) {
            const page = await browser.newPage();
            const relay = [];
            page.on('response', (r) => { if (r.url().includes('calamar-tv-relay')) relay.push(r.status()); });
            page.on('console', (m) => { if (m.type() === 'error') console.log('  consola:', m.text().slice(0, 160)); });
            await page.goto('https://djyuanyo.github.io/Calamar-TV/#/canal/' + encodeURIComponent(ch.id));
            await page.waitForTimeout(25000);
            const s = await page.evaluate(() => { const v = document.getElementById('video'); return { t: v.currentTime, ready: v.readyState, paused: v.paused, status: document.getElementById('player-status')?.textContent.slice(0, 200) }; });
            console.log('==', ch.name, JSON.stringify(s), 'relay', relay.slice(0, 5));
            await page.close();
          }
          await browser.close();
          JS
          node t.mjs
