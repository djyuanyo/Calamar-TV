name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          C=$(curl -s "https://firestore.googleapis.com/v1/projects/menciamedia/databases/(default)/documents/calamarCatalog/custom")
          for i in 0 4 5 20; do
            U=$(echo "$C" | python3 -c "import json,sys;c=json.loads(json.load(sys.stdin)['fields']['json']['stringValue']);print(c['channels'][$i]['streams'][0])")
            N=$(echo "$C" | python3 -c "import json,sys;c=json.loads(json.load(sys.stdin)['fields']['json']['stringValue']);print(c['channels'][$i]['name'])")
            echo "::add-mask::$U"
            echo "== $N"
            curl -s -A "VLC/3.0.20 LibVLC/3.0.20" -o /dev/null -D - --max-time 4 "$U" | grep -iE "^HTTP|^location|^content-type" | sed -E 's#(https?://[^/]+).*#\1/…#' || true
            curl -s -L -A "VLC/3.0.20 LibVLC/3.0.20" --max-time 6 "$U" -o /tmp/s.ts || true
            ffprobe -v error -show_entries stream=codec_type,codec_name,profile,width,height,r_frame_rate -of compact /tmp/s.ts 2>&1 | head -6
          done
