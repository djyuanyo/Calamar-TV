name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "tmdb_id=245648&season=1&episode=1" "tmdb_id=245648&season=1&episode=2" "tmdb_id=229513&season=1&episode=1" "tmdb_id=1396&season=1&episode=1"; do
            echo "== $q"; curl -s -m 20 -A "CalamarTV/2.19" -w "\nHTTP %{http_code}\n" "https://api.theintrodb.org/v4/media?$q" | head -c 600; echo
          done
          echo "CORS:"; curl -s -o /dev/null -D - -H "Origin: https://djyuanyo.github.io" "https://api.theintrodb.org/v4/media?tmdb_id=1396&season=1&episode=1" | grep -iE "^HTTP|access-control"
          echo "hosting relay:"; curl -s -m 20 -H "Origin: https://djyuanyo.github.io" -w "\nHTTP %{http_code}\n" "https://calamarmenciano.com/calamar-lulu.php?introdb=1&tmdb_id=1396&season=1&episode=1" | head -c 300; echo
