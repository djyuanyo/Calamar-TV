name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=https://calamarmenciano.com/calamar-lulu.php
          C=bq4heljir3hb
          echo "::add-mask::$C"
          curl -s -m 30 -H "Origin: https://djyuanyo.github.io" "$H?code=$C&debug=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print('bytes',d.get('bytes'),'titulo',d.get('titulo'));print('sources',(d.get('sources') or '')[:200])" || true
          curl -s -m 30 -H "Origin: https://djyuanyo.github.io" -o /tmp/m -w "hls HTTP %{http_code}\n" "$H?code=$C&hls=1"; head -c 120 /tmp/m; echo
