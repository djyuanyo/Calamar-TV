name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=1atkdtgqs4te
          echo "::add-mask::$C"
          H=https://calamarmenciano.com/calamar-lulu.php
          echo "debug:"; curl -s -m 30 -H "Origin: https://djyuanyo.github.io" "$H?code=$C&debug=1" | python3 -c "import json,sys;d=json.load(sys.stdin);print({k:(v if k!='sources' else (v or '')[:300]) for k,v in d.items()})" || true
          echo "hls:"; curl -s -m 30 -H "Origin: https://djyuanyo.github.io" -o /tmp/m.m3u8 -w "HTTP %{http_code}\n" "$H?code=$C&hls=1"; head -c 600 /tmp/m.m3u8 | sed -E 's/seg=[^&"]+/seg=…/g'; echo
          V=$(grep -v '^#' /tmp/m.m3u8 | head -1)
          if [ -n "$V" ]; then echo "variante:"; curl -s -m 30 -H "Origin: https://djyuanyo.github.io" -o /tmp/v.m3u8 -w "HTTP %{http_code}\n" "https://calamarmenciano.com/$V"; head -c 300 /tmp/v.m3u8 | sed -E 's/seg=[^&"]+/seg=…/g'; echo
            S=$(grep -v '^#' /tmp/v.m3u8 | head -1); [ -n "$S" ] && curl -s -m 30 -o /tmp/s -w "trozo HTTP %{http_code} %{content_type} %{size_download}B\n" "https://calamarmenciano.com/$S"; fi
          echo "directo LuluStream:"; curl -s -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0" -o /tmp/p.html -w "HTTP %{http_code}\n" "https://lulustream.com/e/$C"; grep -o '<title>[^<]*' /tmp/p.html | head -1
