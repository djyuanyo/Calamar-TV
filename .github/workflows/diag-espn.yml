name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=401882832" -o s.json
          python3 - <<'PY'
          import json
          d=json.load(open('s.json'))
          l=d.get('lastFiveGames')
          print('LAST type',type(l).__name__, len(l))
          print('LAST0',json.dumps(l[0])[:1500])
          s=d.get('seasonseries')
          print('SERIES',json.dumps(s)[:2500])
          PY
          for season in 2025 2024 2023; do
            curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/83/schedule?season=$season" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); ev=d.get('events',[])
          print('ALL season',$season,len(ev),sorted({e.get('seasonType',{}).get('name','') for e in ev})[:8])
          vs=[e for e in ev if any(c.get('team',{}).get('id')=='86' for c in e['competitions'][0]['competitors'])]
          print(' vs RM',len(vs),[ (e['date'],e['name'],[ (c['team']['id'],c.get('score',{}).get('displayValue') if isinstance(c.get('score'),dict) else c.get('score')) for c in e['competitions'][0]['competitors']]) for e in vs][:4])
          "
          done
