name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 401882832 401915555 401915840; do
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=$id" -o s.json
          python3 - <<'PY'
          import json
          d=json.load(open('s.json'))
          s=d.get('seasonseries') or []
          for b in s:
            ev=b.get('events',[])
            print('SERIES',b.get('type'),b.get('title'),len(ev))
            if ev:
              e=dict(ev[0]); e.pop('links',None)
              for c in e.get('competitors',[]): c['team']={k:c['team'].get(k) for k in ('id','displayName','logo')}
              print(' keys',sorted(e.keys())); print(' ev0',json.dumps(e)[:900])
          for t in d.get('lastFiveGames') or []: print('LAST',t['team']['displayName'],len(t.get('events',[])),[ (x.get('gameResult'),x.get('score'),x.get('competitionName')) for x in t.get('events',[])][:5])
          PY
          done
