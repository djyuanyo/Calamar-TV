name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
permissions:
  contents: write
jobs:
  diag:
    if: "!contains(github.event.head_commit.message, 'dump data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.58.2
      - run: node diag/web.mjs
      - run: |
          git config user.name diag; git config user.email diag@example.com
          git add diag/*.json diag/*.png && git commit -m "dump data" && git push
