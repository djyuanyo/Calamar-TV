name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
permissions:
  contents: write
jobs:
  diag:
    if: "!contains(github.event.head_commit.message, 'dump data')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node diag/web3.mjs
      - run: |
          git config user.name diag; git config user.email diag@example.com
          git add -f diag/host3.json diag/web3-*.png && git commit -m "dump data" && git push
