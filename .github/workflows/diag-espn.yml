name: diag espn h2h
on:
  push:
    branches: [claude/diag-espn-h2h]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=$(curl -s "https://firestore.googleapis.com/v1/projects/menciamedia/databases/(default)/documents/calamarCatalog/custom")
          U=$(echo "$C" | python3 -c "import json,sys;c=json.loads(json.load(sys.stdin)['fields']['json']['stringValue']);print(c['channels'][4]['streams'][0])")
          V=$(echo "$C" | python3 -c "import json,sys;c=json.loads(json.load(sys.stdin)['fields']['json']['stringValue']);print(c['channels'][5]['streams'][0])")
          echo "::add-mask::$U"; echo "::add-mask::$V"
          echo "Una sola conexión:"; curl -s -L -A "VLC/3.0.20 LibVLC/3.0.20" --max-time 8 "$U" -o /tmp/one -w "HTTP %{http_code}\n" || true; echo "bytes $(wc -c </tmp/one)"
          echo "Dos a la vez (dos canales):"
          ( curl -s -L -A "VLC/3.0.20 LibVLC/3.0.20" --max-time 10 "$U" -o /tmp/a -w "A HTTP %{http_code}\n" || true ) &
          sleep 2
          ( curl -s -L -A "VLC/3.0.20 LibVLC/3.0.20" --max-time 8 "$V" -o /tmp/b -w "B HTTP %{http_code}\n" || true ) &
          wait; echo "A bytes $(wc -c </tmp/a)  B bytes $(wc -c </tmp/b)"; head -c 300 /tmp/b | tr -cd '[:print:]\n'; echo
