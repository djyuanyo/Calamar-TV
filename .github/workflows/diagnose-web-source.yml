name: Diagnostico web de fuente HLS
on:
  push:
    branches: ['diagnose/gate4-web-20261020']
    paths: ['.github/workflows/diagnose-web-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Preparar prueba de navegador
        run: npm install --prefix "$RUNNER_TEMP/hls-probe" --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Observar la reproduccion de la web publica en Chrome
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require(process.env.RUNNER_TEMP + '/hls-probe/node_modules/playwright');
          (async () => {
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage();
            const seen=[];
            page.on('response', async r=>{
              const u=new URL(r.url());
              if(u.pathname.endsWith('.m3u8')||u.pathname.endsWith('.ts')||u.hostname==='mediahostexpert.top'){
                seen.push({host:u.hostname,path:u.pathname,status:r.status(),referer:r.request().headers().referer||null,origin:r.request().headers().origin||null});
                if(u.pathname.endsWith('.m3u8')) console.log('SOURCE',JSON.stringify({host:u.hostname,path:u.pathname,parameters:[...u.searchParams.keys()],status:r.status()}));
              }
            });
            await page.goto('https://djyuanyo.github.io/Calamar-TV/',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{document.body.innerHTML='';const f=document.createElement('iframe');f.src='https://mediahostexpert.top/embed/player?config=2b03fafc-656e-4df7-9cc2-a620a5526af0';f.allow='autoplay; fullscreen; picture-in-picture';document.body.append(f)});
            await page.waitForTimeout(20000);
            console.log('REPORT',JSON.stringify({requests:seen,video:await Promise.all(page.frames().map(f=>f.locator('video').evaluateAll(vs=>vs.map(v=>({time:v.currentTime,width:v.videoWidth,error:v.error?.code||0}))).catch(()=>[]))),text:await Promise.all(page.frames().map(f=>f.locator('body').innerText().then(t=>t.slice(0,1000)).catch(()=>'')))}));
            await browser.close();
          })().catch(e=>{console.log('PROBE_ERROR',e.name,e.message.split('\n')[0]);process.exitCode=1});
          JS
