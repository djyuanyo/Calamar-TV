name: Validar diagnostico de hosting
on:
  push:
    branches: ['diagnose/gate4-web-20261020']
    paths: ['.github/workflows/diagnose-web-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar PHP y formulario sin conexiones externas
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/probe.php"
          php -l "$RUNNER_TEMP/probe.php"
          php -r '$_SERVER["REQUEST_METHOD"]="GET"; ob_start(); include getenv("RUNNER_TEMP")."/probe.php"; ob_end_clean(); assert(publicTarget("http://127.0.0.1/") === null); assert(publicTarget("http://169.254.169.254/") === null); assert(publicTarget("http://10.0.0.1/") === null); assert(redirectTarget("http://example.com/a/b", "/next") === "http://example.com/next"); assert(redirectTarget("http://example.com/a/b", "file:///etc/passwd") === null);'
          php -S 127.0.0.1:8091 -t "$RUNNER_TEMP" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8091/probe.php > "$RUNNER_TEMP/get.html"; then break; fi
            sleep 1
          done
          curl -fsS -d 'source=http%3A%2F%2F127.0.0.1%2Fprivate-secret' http://127.0.0.1:8091/probe.php > "$RUNNER_TEMP/post.html"
          python - <<'PY'
          import os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          get=(root/'get.html').read_text()
          post=(root/'post.html').read_text()
          assert 'Prueba de alojamiento' in get and 'FFmpeg' in get
          assert 'No se ha realizado ninguna conexión' in post
          assert 'private-secret' not in post
          print('PHP y formulario verificados; destino no permitido rechazado sin mostrar la URL.')
          PY
