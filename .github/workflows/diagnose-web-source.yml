name: Diagnostico web de fuente HLS
on:
  push:
    branches: ['diagnose/gate4-web-20261020']
    paths: ['.github/workflows/diagnose-web-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comparar respuestas HLS del catalogo publico
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error, datetime, shutil, subprocess, tempfile, os
          catalog_url = 'https://firestore.googleapis.com/v1/projects/menciamedia/databases/(default)/documents/calamarCatalog/custom'
          origin = 'https://djyuanyo.github.io'
          def read(url, origin_value=None, limit=524288):
              headers = {'User-Agent': 'CalamarTV-Diagnostics/1.0'}
              if origin_value:
                  headers['Origin'] = origin_value
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=10) as response:
                      body = response.read(limit)
                      meta = {'http': response.status,
                              'host': urllib.parse.urlparse(response.url).hostname,
                              'acao': response.headers.get('Access-Control-Allow-Origin'),
                              'content_type': response.headers.get('Content-Type'),
                              'bytes_read': len(body)}
                      return meta, body, response.url
              except urllib.error.HTTPError as error:
                  return {'http': error.code, 'acao': error.headers.get('Access-Control-Allow-Origin')}, b'', url
              except Exception as error:
                  return {'error': type(error).__name__}, b'', url
          metadata, body, _ = read(catalog_url)
          if metadata.get('http') != 200:
              print('CATALOG', json.dumps(metadata))
              raise SystemExit(0)
          doc = json.loads(body)
          catalog = json.loads(doc['fields']['json']['stringValue'])
          links = []
          for channel in catalog.get('channels', []):
              for address in channel.get('streams', []):
                  parsed = urllib.parse.urlparse(address)
                  if parsed.scheme == 'https' and parsed.hostname == 'gate4.st' and parsed.path == '/live3/TR4/index.m3u8' and not parsed.username:
                      links.append(address)
          if not links:
              print('RESULT no_matching_public_source')
              raise SystemExit(0)
          address = links[-1]
          expiry = urllib.parse.parse_qs(urllib.parse.urlparse(address).query).get('e', [None])[0]
          print('SOURCE', json.dumps({'host': 'gate4.st', 'expiry_epoch': expiry, 'matches_supplied_expiry': expiry == '1792534703'}))
          for label, request_origin in [('without_origin', None), ('web_origin', origin)]:
              meta, body, final_url = read(address, request_origin)
              print(label, 'manifest', json.dumps(meta))
              if meta.get('http') != 200:
                  continue
              text = body.decode('utf-8', 'replace')
              if not text.startswith('#EXTM3U'):
                  print(label, 'not_hls')
                  continue
              urls = [line.strip() for line in text.splitlines() if line.strip() and not line.startswith('#')]
              if '#EXT-X-STREAM-INF' in text and urls:
                  meta, body, final_url = read(urllib.parse.urljoin(final_url, urls[0]), request_origin)
                  print(label, 'variant', json.dumps(meta))
                  if meta.get('http') != 200:
                      continue
                  text = body.decode('utf-8', 'replace')
                  urls = [line.strip() for line in text.splitlines() if line.strip() and not line.startswith('#')]
              print(label, 'playlist', json.dumps({'has_media_segments': '#EXTINF' in text, 'has_encryption_tag': '#EXT-X-KEY' in text}))
              if '#EXTINF' in text and urls:
                  segment = urllib.parse.urljoin(final_url, urls[-1])
                  meta, sample, _ = read(segment, request_origin, 2097152 if label == 'web_origin' else 4096)
                  print(label, 'segment', json.dumps(meta))
                  if label == 'web_origin' and meta.get('http') == 200:
                      if shutil.which('ffprobe'):
                          fd, sample_path = tempfile.mkstemp(suffix='.ts')
                          with os.fdopen(fd, 'wb') as out:
                              out.write(sample)
                          result = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'stream=codec_name,codec_type,profile,pix_fmt,width,height,level', '-of', 'json', sample_path], capture_output=True, text=True, timeout=15)
                          try:
                              print('CODECS', json.dumps(json.loads(result.stdout)))
                          except Exception:
                              print('CODECS', result.returncode)
                          os.remove(sample_path)
                      else:
                          print('CODECS ffprobe_unavailable')
          PY
