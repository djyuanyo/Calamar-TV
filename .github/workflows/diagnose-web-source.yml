name: Validar prueba de video del hosting
on:
  push:
    branches: ['diagnose/gate4-web-20261020']
    paths: ['.github/workflows/diagnose-web-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar PHP, rechazo de destinos y ciclo del reproductor
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/probe.zip"
          unzip -o "$RUNNER_TEMP/probe.zip" -d "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          php -l calamar-video-test-9a62.php
          node --check calamar-video-test-9a62.js
          php -S 127.0.0.1:8091 > "$RUNNER_TEMP/php-server.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"' EXIT
          for attempt in {1..10}; do
            if curl -fsS http://127.0.0.1:8091/calamar-video-test-9a62.php > "$RUNNER_TEMP/get.html"; then break; fi
            sleep 1
          done
          code=$(curl -sS -o "$RUNNER_TEMP/bad.txt" -w '%{http_code}' 'http://127.0.0.1:8091/calamar-video-test-9a62.php?stream=1')
          test "$code" = 400
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const nodes=Object.fromEntries(['video','report','source','start','stop'].map(id=>[id,{value:'',textContent:''}]));
          let config,source,destroyed=0,onTimer;
          const handlers={};
          const player={on:(event,cb)=>handlers[event]=cb,pause(){},destroy(){destroyed++},attachMediaElement(){},load(){},play:()=>Promise.resolve()};
          const mpegts={getFeatureList:()=>({msePlayback:true,mseLivePlayback:true,mseH265Playback:true}),Events:{ERROR:'error',MEDIA_INFO:'info'},createPlayer:(s,c)=>{source=s;config=c;return player}};
          const window={mpegts,addEventListener(){}};
          const ctx={window,mpegts,document:{getElementById:id=>nodes[id]},location:{pathname:'/calamar-video-test-9a62.php',origin:'https://example.com'},URL,TextEncoder,btoa:s=>Buffer.from(s,'binary').toString('base64'),setTimeout:f=>{onTimer=f;return 1},clearTimeout(){}};
          vm.runInNewContext(fs.readFileSync('calamar-video-test-9a62.js','utf8'),ctx);
          nodes.source.value='http://31.43.191.125:8080/TestUser/TestSecret/244';
          nodes.start.onclick();
          assert.equal(source.url,'https://example.com/calamar-video-test-9a62.php?stream=1');
          assert.equal(Buffer.from(config.headers['X-Calamar-Source'],'base64').toString(),'http://31.43.191.125:8080/TestUser/TestSecret/244');
          assert.equal(nodes.source.value,'');
          nodes.video.onplaying();
          onTimer();
          assert.equal(destroyed,1);
          assert.match(nodes.report.textContent,/se ha reproducido/);
          assert(!nodes.report.textContent.includes('TestSecret'));
          console.log('PLAYER_TEST_OK: cabecera privada, URL sin credenciales y detención automática.');
          JS
