name: Validar puente HTTPS
on:
  push:
    branches: ['diagnose/gate4-web-20261020']
    paths: ['.github/workflows/diagnose-web-source.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar PHP y acceso CORS sin iniciar una emision
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/relay.php"
          php -l "$RUNNER_TEMP/relay.php"
          php -S 127.0.0.1:8091 -t "$RUNNER_TEMP" > "$RUNNER_TEMP/php-server.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid"' EXIT
          for attempt in {1..10}; do
            if curl -sS http://127.0.0.1:8091/relay.php > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8091/relay.php?stream=1')" = 400
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://other.example' 'http://127.0.0.1:8091/relay.php?stream=1')" = 403
          curl -sS -D "$RUNNER_TEMP/cors.txt" -o /dev/null -X OPTIONS -H 'Origin: https://djyuanyo.github.io' -H 'Access-Control-Request-Headers: x-calamar-source' http://127.0.0.1:8091/relay.php
          python - <<'PY'
          import pathlib,os
          headers=(pathlib.Path(os.environ['RUNNER_TEMP'])/'cors.txt').read_text().lower()
          assert '204 no content' in headers
          assert 'access-control-allow-origin: https://djyuanyo.github.io' in headers
          assert 'access-control-allow-headers: x-calamar-source, range' in headers
          print('RELAY_TEST_OK: PHP válido, sin fuente 400, origen no autorizado 403 y preflight de Pages 204.')
          PY
