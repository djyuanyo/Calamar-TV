name: Calamar TV · Eventos en navegador
on:
  push:
    paths: ['web/**', 'hosting/calamar-drive.php', 'hosting/calamar-vidara.php', 'tools/library_vidara.test.mjs', 'tools/test_drive_relay.py', 'tools/library_folders.test.mjs', 'tools/browser_*.mjs', '.github/workflows/events-ui.yml']
  pull_request:
    paths: ['web/**', 'hosting/calamar-drive.php', 'hosting/calamar-vidara.php', 'tools/library_vidara.test.mjs', 'tools/test_drive_relay.py', 'tools/library_folders.test.mjs', 'tools/browser_*.mjs', '.github/workflows/events-ui.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probar carpetas mixtas y puente de Google Drive
        run: |
          php -l hosting/calamar-drive.php
          php -l hosting/calamar-vidara.php
          python -m unittest discover -s tools -p 'test_drive_relay.py' -v
          node --test tools/library_folders.test.mjs tools/library_lulu.test.mjs tools/library_vidara.test.mjs
      - run: npm install --prefix /tmp/calamar-ui --no-audit --no-fund playwright@1.58.2 hls.js@1.5.17
      - name: Probar eventos con catálogo aislado
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_events_check.mjs

      - name: Decodificar HLS directo y desde hosting con conexiones lentas
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_HLS: /tmp/calamar-ui/node_modules/hls.js/dist/hls.min.js
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_hosting_check.mjs

      - name: Renovar tokens sin reiniciar el vídeo
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_HLS: /tmp/calamar-ui/node_modules/hls.js/dist/hls.min.js
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_continuity_check.mjs

      - name: Reproducir cuatro ventanas simultáneas con vídeo real
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_HLS: /tmp/calamar-ui/node_modules/hls.js/dist/hls.min.js
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_multi_check.mjs

      - name: Añadir un canal Zico y reproducirlo con el reproductor propio
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_HLS: /tmp/calamar-ui/node_modules/hls.js/dist/hls.min.js
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_zico_channel_check.mjs

      - name: Probar acceso opcional y panel de usuarios con cuentas aisladas
        env:
          CALAMAR_PLAYWRIGHT: /tmp/calamar-ui/node_modules/playwright
          CALAMAR_CHROME_CHANNEL: chrome
        run: node tools/browser_access_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-ui-preview
          path: tools/ui-artifacts/*.png
