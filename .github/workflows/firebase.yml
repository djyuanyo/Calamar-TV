name: Calamar TV · Permisos de Firebase
on:
  push:
    paths: ['firebase/**', 'web/shared-catalog.js', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firebase/**', 'web/shared-catalog.js', '.github/workflows/firebase.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: firebase
      - run: npm test
        working-directory: firebase
