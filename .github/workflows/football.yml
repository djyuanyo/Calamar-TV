name: Sincronizar agenda de fútbol
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calamar-football-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Consultar agenda pública ZicoTV
        run: python tools/sync_football.py
      - name: Publicar JSON cuando cambie
        run: |
          if ! git diff --quiet -- data/football.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/football.json
            git commit -m "Actualizar agenda de fútbol"
            git push
          fi
