name: Calamar TV · Web y catálogo
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', 'tools/**', 'hosting/calamar-images.php', 'hosting/README-Imagenes-GitHub.txt', '.github/workflows/web.yml']
  schedule:
    - cron: '17 */6 * * *'
    # Event preview pages (evento/<slug>/) follow the catalog edited in the admin within ~15 minutes.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: calamar-web
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar instalador de Chromecast
        run: |
          php -l hosting/calamar-images.php
          php -l hosting/calamar-library.php
          php -l hosting/calamar-match.php
          php -l hosting/calamar-http-source.php
          php -l hosting/calamar-tv-relay.php
          php -l hosting/calamar-video.php
          php -l hosting/calamar-cast.php
          php -l hosting/calamar-cast-install.php
      - name: Probar el lector de TDTChannels
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Probar los enlaces de los canales
        run: node --test tools/match_scores.test.mjs tools/sports.test.mjs tools/events.test.mjs tools/catalog_slugs.test.mjs tools/stream_errors.test.mjs tools/direct_player.test.mjs tools/player_sources.test.mjs tools/ts_player.test.mjs tools/cast_player.test.mjs tools/audience.test.mjs tools/video_bridge.test.mjs tools/github_images.test.mjs tools/library.test.mjs tools/match_center.test.mjs
      - name: Actualizar canales TDT
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */6 * * *'
        run: |
          python tools/sync_tdt.py || echo "::warning::No se pudo actualizar TDTChannels; se publica el catálogo anterior"
          if ! git diff --quiet -- data/tdt.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tdt.json
            git commit -m "Actualizar canales TDT"
            git push
          fi
      - name: Montar la web
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r data _site/data
          mkdir -p _site/downloads
          (cd hosting && zip ../_site/downloads/Calamar-Imagenes-GitHub.zip calamar-images.php README-Imagenes-GitHub.txt)
          (cd hosting && zip ../_site/downloads/Calamar-Peliculas-Series.zip calamar-library.php calamar-images.php README-Peliculas-Series.txt)
          # Every deploy loads as a whole: without this a browser can mix new and cached old files.
          python tools/version_assets.py _site "${GITHUB_SHA::12}"
          # One page per event with its cover and name, so shared links show them in WhatsApp.
          python tools/event_pages.py _site https://djyuanyo.github.io/Calamar-TV/
          python -c "import json; [json.load(open(f'_site/data/{n}.json')) for n in ('tdt', 'custom')]"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4