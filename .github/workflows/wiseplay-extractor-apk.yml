name: Compilar Extractor Wiseplay APK
on:
  push:
    branches:
      - android/wiseplay-extractor-apk
    paths:
      - 'tools/wiseplay-extractor-android/**'
      - '.github/workflows/wiseplay-extractor-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/wiseplay-extractor-android/**'
      - '.github/workflows/wiseplay-extractor-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/wiseplay-extractor-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Extractor-Wiseplay-APK
          path: tools/wiseplay-extractor-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
