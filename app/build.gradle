plugins { id 'com.android.application' }
android {
    namespace 'es.yuanyo.calamartv'
    compileSdk 35
    defaultConfig {
        applicationId 'es.yuanyo.calamartv'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '2.1.0'
    }
    if (System.getenv('CALAMAR_KEYSTORE_PATH')) {
        signingConfigs {
            distribution {
                storeFile file(System.getenv('CALAMAR_KEYSTORE_PATH'))
                storePassword System.getenv('CALAMAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CALAMAR_KEY_ALIAS')
                keyPassword System.getenv('CALAMAR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CALAMAR_KEYSTORE_PATH')) signingConfig signingConfigs.distribution
        }
    }
    // The same catalog the web publishes is bundled as the offline fallback.
    sourceSets { main { assets.srcDirs += rootProject.file('data') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
