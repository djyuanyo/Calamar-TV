plugins { id 'com.android.application' }
android {
    namespace 'es.yuanyo.calamartv'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'es.yuanyo.calamartv'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 24
        targetSdk 35
        versionCode 46
        versionName '2.16.1'
    }
    if (System.getenv('CALAMAR_KEYSTORE_PATH')) {
        signingConfigs {
            distribution {
                storeFile file(System.getenv('CALAMAR_KEYSTORE_PATH'))
                storePassword System.getenv('CALAMAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CALAMAR_KEY_ALIAS')
                keyPassword System.getenv('CALAMAR_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('CALAMAR_KEYSTORE_PATH')) signingConfig signingConfigs.distribution
        }
        // With the permanent key the debug APK also updates the installed app instead of conflicting with it.
        debug {
            if (System.getenv('CALAMAR_KEYSTORE_PATH')) signingConfig signingConfigs.distribution
        }
    }
    // The same catalog the web publishes is bundled as the offline fallback.
    sourceSets { main { assets.srcDirs += rootProject.file('data') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}