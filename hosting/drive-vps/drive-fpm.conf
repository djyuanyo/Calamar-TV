[global]
error_log = syslog
daemonize = no

[drive]
listen = /run/calamar-drive/play.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 12
pm.max_requests = 200
clear_env = yes
env[CALAMAR_DRIVE_VPS] = 1

[drive-input]
listen = /run/calamar-drive/input.sock
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.max_requests = 200
clear_env = yes
env[CALAMAR_DRIVE_VPS] = 1
