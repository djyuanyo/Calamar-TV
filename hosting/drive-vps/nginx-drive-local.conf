server {
    listen 127.0.0.1:8091;
    access_log off;
    error_log /dev/null crit;
    location = /calamar-drive.php {
        if ($arg_hls != "") { return 404; }
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/calamar-drive/calamar-drive.php;
        fastcgi_pass unix:/run/calamar-drive/input.sock;
        fastcgi_buffering off;
    }
    location / { return 404; }
}

server {
    listen 127.0.0.1:8092;
    include /etc/calamar-drive/nginx-drive-location.conf;
    location / { return 404; }
}
