location = /calamar-drive.php {
    access_log off;
    error_log /dev/null crit;
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /opt/calamar-drive/calamar-drive.php;
    fastcgi_pass unix:/run/calamar-drive/play.sock;
    fastcgi_buffering off;
    fastcgi_read_timeout 90s;
}
