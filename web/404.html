<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calamar TV</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#f5f5f5;font:16px system-ui,sans-serif}a{color:#d6ff00}</style>
<script>
  // GitHub Pages answers here for any address it does not have. An event or channel shared before its
  // preview page was published (evento/<slug>/, canal/<slug>/) still opens it in the web; the app's short link to sign
  // in from a phone (tv/<key>) opens that page.
  (function () {
    var path = location.pathname, tv = path.match(/^(.*\/)tv\/([A-Za-z0-9]{4})\/?$/);
    var code = (location.search.match(/[?&]c=([A-Za-z0-9]{4})/) || [])[1];
    if (tv) { location.replace(tv[1] + '#/tv/' + tv[2].toUpperCase() + (code ? '/' + code.toUpperCase() : '')); return; }
    var live = path.match(/^(.*\/)directo\/?$/);
    if (live) { location.replace(live[1] + '#/directo'); return; }
    var found = path.match(/^(.*\/)(evento|canal|liga)\/([^/]+)/);
    var base = found ? found[1] : '/' + (path.split('/')[1] || '') + '/';
    location.replace(base + (found ? '#/' + found[2] + '/' + found[3] : ''));
  })();
</script>
</head>
<body><p><a href="./">Abrir Calamar TV</a></p></body>
</html>
