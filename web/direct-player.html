<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Calamar TV · Reproductor integrado</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #08090b; color: white; font: 15px Arial, Helvetica, sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; }
      video { width: 100%; flex: 1; min-height: 0; background: black; }
      footer { padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      button { font: inherit; padding: 10px 16px; border: 0; border-radius: 22px; background: #d4ff41; color: #10120c; cursor: pointer; }
      button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      #status { flex: 1; min-width: 160px; }
    </style>
  </head>
  <body>
    <main>
      <video id="video" controls playsinline controlslist="nofullscreen nodownload" aria-label="Emisión en directo"></video>
      <footer>
        <button type="button" id="play">Reproducir / Pausar</button>
        <button type="button" id="retry">Reintentar</button>
        <span id="status" role="status">Conectando…</span>
      </footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script type="module" src="direct-player.js"></script>
  </body>
</html>
