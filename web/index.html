<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calamar TV</title>
    <meta name="description" content="Canales de TDT en abierto y canales de Calamar TV en directo." />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#view">Saltar al contenido</a>
    <header class="top">
      <div class="top-inner">
        <a class="brand" href="#/" aria-label="Calamar TV beta, inicio">
          <img class="header-brand-logo" src="./assets/calamar-menciano-tv.png" alt="Calamar Menciano TV" width="90" height="100" />
          <span class="beta-tag" aria-hidden="true">Beta</span>
        </a>
        <nav class="nav" aria-label="Secciones">
          <a href="#/" data-route="inicio">Inicio</a>
          <a href="#/canales" data-route="canales">Canales</a>
          <a href="#/peliculas" data-route="peliculas" data-library hidden>Películas</a>
          <a href="#/series" data-route="series" data-library hidden>Series</a>
          <a href="#/documentales" data-route="documentales" data-library hidden>Documentales</a>
          <a href="#/multipantalla" data-route="multipantalla">Multipantalla</a>
        </nav>
        <label class="search">
          <span class="sr">Buscar canal</span>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 4 11.6l4.5 4.5 1.4-1.4-4.5-4.5A6.5 6.5 0 0 0 10.5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg>
          <input id="search" type="search" placeholder="Buscar canales y eventos" autocomplete="off" />
        </label>
        <a class="admin-link" href="#/admin" data-route="admin" title="Administración" aria-label="Administración"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4.2 3.1-6.6 7-6.6s7 2.4 7 6.6"/></svg></a>
      </div>
    </header>

    <main id="view" tabindex="-1">
      <div class="skeleton-hero" aria-hidden="true"></div>
      <p class="status" role="status">Cargando canales…</p>
    </main>

    <div class="player idle" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="player-screen">
      <div class="player-stage">
        <video id="video" playsinline autoplay></video>
        <div class="player-shade" aria-hidden="true"></div>
        <div class="player-center">
          <span class="spinner" aria-hidden="true"></span>
          <button class="center-play" id="ctl-center" type="button" aria-label="Reproducir"></button>
        </div>
        <div class="skip-actions">
          <button class="skip-btn" id="player-skip-intro" type="button" hidden>Saltar intro</button>
          <button class="skip-btn" id="player-next" type="button" hidden>Siguiente capítulo</button>
          <button class="skip-dismiss" id="player-next-dismiss" type="button" aria-label="Seguir viendo los créditos" hidden>✕</button>
        </div>
      </div>

      <div class="player-top">
        <button class="icon-btn" id="player-close" type="button" aria-label="Volver"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
        <img class="player-logo" id="player-logo" alt="" hidden referrerpolicy="no-referrer" />
        <div class="player-heading">
          <h2 id="player-title"></h2>
        </div>
        <div class="player-toolbar" aria-label="Controles del reproductor">
          <span class="viewers" id="player-viewers" role="status" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><b></b><span class="sr"></span></span>
          <button class="icon-btn" id="ctl-full" type="button" aria-label="Pantalla completa" aria-pressed="false"></button>
          <div class="player-sources" id="player-sources" role="group" aria-label="Fuentes" hidden></div>
          <button class="pill-btn" id="player-refresh" type="button">Refrescar</button>
          <button class="pill-btn" id="player-share" type="button" hidden>Compartir</button>
          <button class="pill-btn share-screen" id="ctl-cast" type="button" aria-label="Compartir pantalla" title="Compartir pantalla" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8V4h16v14h-7M3 12a9 9 0 0 1 9 9M3 16a5 5 0 0 1 5 5"/><circle cx="3.5" cy="20.5" r=".7" fill="currentColor"/></svg></button>
        </div>

      </div>

      <p class="player-status" id="player-status" role="status" aria-live="polite"></p>

      <div class="player-bottom">
        <div class="cast-remote-controls">
          <button class="pill-btn" id="ctl-cast-toggle" type="button" aria-label="Reproducir o pausar en Chromecast" hidden>Ⅱ TV</button>
          <button class="pill-btn" id="ctl-cast-disconnect" type="button" hidden>Desconectar TV</button>
        </div>
        <input class="range seek" id="ctl-seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Posición" hidden />
        <div class="controls">
          <button class="icon-btn" id="ctl-play" type="button" aria-label="Reproducir"></button>
          <div class="volume">
            <button class="icon-btn" id="ctl-mute" type="button" aria-label="Silenciar"></button>
            <input class="range" id="ctl-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen" />
          </div>
          <button class="live-btn" id="ctl-live" type="button" title="Ir al directo" hidden><span class="dot" aria-hidden="true"></span>DIRECTO</button>
          <span class="time" id="ctl-time" hidden>0:00 / 0:00</span>
          <span class="spacer"></span>
          <div class="quality">
            <button class="icon-btn" id="ctl-quality" type="button" aria-label="Calidad" aria-haspopup="menu" aria-expanded="false" hidden></button>
            <div class="menu" id="ctl-menu" role="menu" aria-label="Calidad de vídeo" hidden></div>
          </div>
          <button class="icon-btn" id="ctl-pip" type="button" aria-label="Imagen en imagen" hidden></button>
        </div>
      </div>
      </div>
      <!-- Events with a Google match link: information, statistics and line-ups under the video. -->
      <section class="match-center" id="match-center" aria-label="Datos del partido" hidden></section>
    </div>

    <footer class="foot">
      <div class="foot-inner">
        <a class="brand" href="#/" aria-label="Calamar TV, inicio">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5.5v13l11-6.5z" fill="currentColor" /></svg></span>
          <span class="brand-name">CALAMAR<span>TV</span></span>
        </a>
        <p>
          Canales TDT: emisiones oficiales recopiladas por
          <a href="https://github.com/LaQuay/TDTChannels" rel="noopener">TDTChannels</a>. Algunas emisiones solo
          funcionan desde España. La app Android/TV usa el mismo catálogo.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
