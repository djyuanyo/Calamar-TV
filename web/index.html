<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calamar TV</title>
    <meta name="description" content="Canales de TDT en abierto y canales de Calamar TV en directo." />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d6ff00'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%230b0d10'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">CALAMAR <span>/</span> TV</a>
      <nav class="nav" aria-label="Secciones">
        <a href="#/" data-route="inicio">Inicio</a>
        <a href="#/canales" data-route="canales">Canales</a>
      </nav>
      <label class="search">
        <span class="sr">Buscar canal</span>
        <input id="search" type="search" placeholder="Buscar canal" autocomplete="off" />
      </label>
      <a class="admin-link" href="#/admin" data-route="admin" title="Administración">Admin</a>
    </header>

    <main id="view" tabindex="-1"><p class="status">Cargando canales…</p></main>

    <div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="player-title">
      <div class="player-bar">
        <button class="ghost" id="player-close" type="button">← Volver</button>
        <h2 id="player-title"></h2>
        <div class="player-sources" id="player-sources"></div>
        <button class="ghost" id="player-copy" type="button">Copiar enlace</button>
      </div>
      <video id="video" controls playsinline autoplay></video>
      <p class="player-status" id="player-status" aria-live="polite"></p>
    </div>

    <footer class="foot">
      <p>
        Canales TDT: emisiones oficiales recopiladas por
        <a href="https://github.com/LaQuay/TDTChannels" rel="noopener">TDTChannels</a>. Algunas emisiones solo
        funcionan desde España. La app Android/TV usa el mismo catálogo.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
