<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Tráiler</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font:13px system-ui;color:white}
#player{width:100%;height:calc(100% - 28px);min-height:200px;visibility:hidden}body.playing #player{visibility:visible}
#timeline{height:28px;display:none;align-items:center;gap:10px;padding:0 12px;background:#101114;box-sizing:border-box}body.playing #timeline{display:flex}
progress{flex:1;width:0;height:4px;accent-color:#d4ff00;border:0}progress::-webkit-progress-bar{background:#484b50;border-radius:4px}progress::-webkit-progress-value{background:#d4ff00;border-radius:4px}
#start{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border:0;border-radius:24px;background:#fff;color:#111;font:600 14px system-ui;cursor:pointer}body.blocked #start{display:block}#start:focus-visible{outline:3px solid #d4ff00;outline-offset:4px}
</style><div id="player"></div><div id="timeline"><progress id="progress" max="1" value="0" aria-label="Progreso del tráiler"></progress><span id="remaining" aria-label="Tiempo restante">0:00</span></div><button id="start" type="button">▶ Reproducir tráiler con sonido</button>
<script>
let player, tick; const id=new URLSearchParams(location.search).get('v');
const button=document.getElementById('start'), progress=document.getElementById('progress'), remaining=document.getElementById('remaining');
function notify(state){if(parent!==window)parent.postMessage({type:'calamar-trailer',state},location.origin)}
function clearTick(){clearInterval(tick);tick=undefined}
function fallback(){clearTick();document.body.classList.remove('playing','blocked');notify('fallback')}
function updateTime(){try{const duration=player.getDuration(), position=player.getCurrentTime();if(!Number.isFinite(duration)||duration<=0)return;progress.max=duration;progress.value=Math.min(duration,Math.max(0,position));const left=Math.max(0,Math.ceil(duration-position));remaining.textContent=`-${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`}catch{}}
function blocked(){clearTick();document.body.classList.remove('playing');document.body.classList.add('blocked');notify('blocked')}
window.pauseTrailer=()=>{clearTick();try{player?.pauseVideo()}catch{}};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='pause-trailer')window.pauseTrailer()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.pauseTrailer()});
window.addEventListener('pagehide',window.pauseTrailer);
button.onclick=()=>{try{player.unMute();player.setVolume(100);player.playVideo()}catch{fallback()}};
function onYouTubeIframeAPIReady(){if(!/^[\w-]{11}$/.test(id||''))return;player=new YT.Player('player',{videoId:id,host:'https://www.youtube-nocookie.com',playerVars:{autoplay:1,controls:0,fs:0,playsinline:1,rel:0,origin:location.origin},events:{onReady:e=>{e.target.unMute();e.target.setVolume(100);e.target.playVideo()},onStateChange:e=>{clearTick();if(e.data===1){document.body.classList.remove('blocked');document.body.classList.add('playing');updateTime();tick=setInterval(updateTime,250);notify('playing')}else if(e.data===0){fallback()}else if(e.data===2){document.body.classList.add('blocked')}},onError:fallback,onAutoplayBlocked:blocked}})}
</script><script src="https://www.youtube.com/iframe_api" onerror="fallback()"></script></html>
