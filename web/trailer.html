<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Tráiler</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#player{width:100%;height:100%;min-height:200px;visibility:hidden}body.playing #player{visibility:visible}</style><div id="player"></div>
<script>
let player; const id=new URLSearchParams(location.search).get('v');
function notify(state){ if(parent!==window)parent.postMessage({type:'calamar-trailer',state},location.origin); }
function fallback(){document.body.classList.remove('playing');notify('fallback');}
window.pauseTrailer=()=>{try{player?.pauseVideo()}catch{}};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='pause-trailer')window.pauseTrailer()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.pauseTrailer()});
function onYouTubeIframeAPIReady(){if(!/^[\w-]{11}$/.test(id||''))return;player=new YT.Player('player',{videoId:id,host:'https://www.youtube-nocookie.com',playerVars:{autoplay:1,mute:1,playsinline:1,rel:0,origin:location.origin},events:{onReady:e=>{e.target.mute();e.target.playVideo()},onStateChange:e=>{if(e.data===1){document.body.classList.add('playing');notify('playing')}if(e.data===0)fallback()},onError:fallback,onAutoplayBlocked:fallback}})}
</script><script src="https://www.youtube.com/iframe_api" onerror="fallback()"></script></html>
